<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14111f">
<title>Pixelator</title>
<link rel="icon" type="image/png" href="favicon-64.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo" aria-label="Pixelator"><i></i><i></i><i></i><i></i><span>PIXELATOR</span></div>
  <p>Turn any photo or video into pixel art.</p>
</header>

<main>
  <section class="stage" id="stage">
    <div class="drop" id="drop">
      <div class="drop-inner">
        <div class="invader" aria-hidden="true"></div>
        <h2>Drop photos &amp; videos here</h2>
        <p>or</p>
        <label class="btn primary">Choose files
          <input type="file" id="file" accept="image/*,video/*,.heic,.heif" multiple hidden>
        </label>
      </div>
    </div>
    <canvas id="view" hidden></canvas>
    <div class="crop" id="crop" hidden>
      <div class="crop-box" id="cropBox">
        <i data-h="nw"></i><i data-h="n"></i><i data-h="ne"></i><i data-h="e"></i>
        <i data-h="se"></i><i data-h="s"></i><i data-h="sw"></i><i data-h="w"></i>
      </div>
    </div>
    <div class="crop-bar" id="cropBar" hidden>
      <select id="cropAspect" aria-label="Crop shape">
        <option value="free">Free</option><option value="orig">Original shape</option>
        <option value="1:1">Square 1:1</option><option value="4:3">4:3</option><option value="3:2">3:2</option>
        <option value="16:9">16:9</option><option value="9:16">9:16 (vertical)</option>
      </select>
      <button class="btn" id="cropCancel" type="button">Cancel</button>
      <button class="btn primary" id="cropApply" type="button">Apply crop</button>
    </div>
    <div class="progress" id="progress" hidden><div id="bar"></div><span id="ptext"></span></div>
  </section>

  <aside class="panel">
    <div class="files" id="files"></div>

    <div class="row">
      <button class="btn" id="cropBtn" type="button" disabled>Crop…</button>
      <button class="btn" id="cropReset" type="button" hidden>Reset crop</button>
    </div>

    <div class="soundbox" id="soundBox" hidden>
      <label class="check"><input type="checkbox" id="previewSound" checked> Play sound in preview</label>
      <label>Volume <output id="volOut"></output>
        <input type="range" id="vol" min="0" max="100" value="100">
      </label>
      <p class="hint">The volume is used in the saved video too. 0% saves it without sound.</p>
    </div>

    <label>Look
      <select id="look"></select>
    </label>
    <label id="strengthRow" hidden>Look strength <output id="strengthOut"></output>
      <input type="range" id="strength" min="0" max="100" value="100">
    </label>
    <label class="check" id="osdRow" hidden><input type="checkbox" id="osd" checked> Show tape on-screen text (PLAY, date)</label>

    <label>Pixel size <output id="sizeOut"></output>
      <input type="range" id="size" min="1" max="64" value="8">
    </label>

    <label>Palette
      <select id="palette"></select>
    </label>
    <div class="swatches" id="swatches"></div>

    <label id="levelsRow">Colors per channel <output id="levelsOut"></output>
      <input type="range" id="levels" min="2" max="16" value="6">
    </label>

    <label>Dithering <output id="ditherOut"></output>
      <input type="range" id="dither" min="0" max="100" value="40">
    </label>

    <div class="row">
      <button class="btn primary" id="save" disabled>Save this</button>
      <button class="btn" id="saveAll" disabled>Save all</button>
    </div>
    <p class="hint" id="hint">Images save as PNG. Videos are re-rendered in real time and save as WebM/MP4.</p>
  </aside>
</main>

<div class="toast" id="toast" role="status"></div>
<script src="pixelate.js"></script>
<script src="app.js"></script>
</body>
</html>
